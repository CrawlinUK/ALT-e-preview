<!DOCTYPE html>
<html lang="en" class="shared-unit-template">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ALT-e — Classroom Tools</title>
  <link rel="preload"
        href="font/HandwritingWeCan-Medium.otf?v=20261013-book2-unit2-images"
        as="font"
        type="font/otf"
        crossorigin>
  <link rel="preload" href="images/ui/AlsoHomeSweet.svg?v=20261013-book2-unit2-images" as="image" type="image/svg+xml">
  <link rel="preload" href="images/ui/AlsoBackArrow.svg?v=20261013-book2-unit2-images" as="image" type="image/svg+xml">
  <link rel="preload" href="images/ui/AlsoNewWindowIcon.svg?v=20261013-book2-unit2-images" as="image" type="image/svg+xml">
  <link rel="preload" href="images/ui/AlsoCogSettings.svg?v=20261013-book2-unit2-images" as="image" type="image/svg+xml">
  <style>
    /* LD-unit and TL-unit share the same full-screen geometry. Only LD-unit
       has a background and captures input; TL-unit is transparent. */
    #loadingScreen,
    #titleOverlay {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
    }
    #loadingScreen {
      z-index: 9999;
      background: var(--page, #f8fbfa);
    }
    #titleOverlay {
      z-index: 10000;
      pointer-events: none;
      opacity: 1;
      transition: opacity .5s ease;
    }
    #titleOverlay.title-fading {
      opacity: 0;
    }
    #titleOverlay[hidden] { display: none !important; }
    #titleOverlay .loading-cogs { visibility: hidden; }
    .loading-panel {
      display: grid;
      justify-items: center;
      gap: 16px;
      color: #263238;
      font-family: Arial, sans-serif;
      width: min(92vw, 1100px);
      text-align: center;
    }
    .unit-intro-title {
      margin: 0;
      font-family: "HandwritingWeCan", Arial, sans-serif;
      font-size: clamp(38px, 7vw, 100px);
      line-height: 1.2;
      overflow-wrap: anywhere;
      font-weight: 700;
      /* Keep the title legible over either theme and colourful flashcards.
         Identical outline on both layers avoids a visible jump. */
      -webkit-text-stroke: 3px var(--page, #f8fbfa);
      paint-order: stroke fill;
    }
    #loadingLabel {
      position: absolute;
      top: calc(50% + 112px);
      left: 0;
      right: 0;
      text-align: center;
    }
    #loadingLabel:empty { display: none; }
    .loading-cogs {
      position: relative;
      width: 108px;
      height: 78px;
    }
    .loading-cog {
      position: absolute;
      display: grid;
      place-items: center;
      width: 66px;
      height: 66px;
      font-size: 66px;
      line-height: 1;
      color: #00ada9;
      transform-origin: center;
      animation: alte-cog-clockwise 2.2s linear infinite;
    }
    .loading-cog:first-child {
      left: 0;
      top: 0;
    }
    .loading-cog:last-child {
      right: 0;
      bottom: 0;
      width: 48px;
      height: 48px;
      font-size: 48px;
      color: #56666a;
      animation-name: alte-cog-counterclockwise;
      animation-duration: 1.75s;
    }
    #loadingLabel {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: .02em;
    }
    #loadingScreen.loading-error .loading-cog {
      animation-play-state: paused;
    }
    @keyframes alte-cog-clockwise {
      to { transform: rotate(360deg); }
    }
    @keyframes alte-cog-counterclockwise {
      to { transform: rotate(-360deg); }
    }
    @media (prefers-reduced-motion: reduce) {
      .loading-cog { animation-duration: 6s; }
    }
  </style>
  <link rel="stylesheet" href="css/classroom.css?v=20261125-alte-v81.1">
  <script src="js/loading-intro.js?v=20261125-alte-v81.1" defer></script>
  <script src="js/unit-loader.js?v=20261125-alte-v81.1" defer></script>
  <script src="js/theme.js?v=20261125-alte-v81.1"></script>
</head>
<body>
  <div id="loadingScreen" role="status" aria-live="polite" aria-label="Loading">
    <div class="loading-panel">
      <h1 id="loadingTitle" class="unit-intro-title">ALT-e</h1>
      <div class="loading-cogs" aria-hidden="true">
        <div class="loading-cog">⚙</div>
        <div class="loading-cog">⚙</div>
      </div>
    </div>
    <div id="loadingLabel" aria-live="assertive"></div>
  </div>
  <div id="titleOverlay" aria-hidden="true" hidden>
    <div class="loading-panel">
      <h1 id="introTitle" class="unit-intro-title"></h1>
      <div class="loading-cogs" aria-hidden="true"></div>
    </div>
  </div>
  <div id="alteApp"></div>
  <noscript>This classroom app requires JavaScript.</noscript>
</body>
</html>
